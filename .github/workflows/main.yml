name: Quran Bot

on:
  schedule:
    # 3 times per day: 00:00, 08:00, 16:00 UTC
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OAuth credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -z "$CLIENT_SECRETS" ] || [ -z "$YOUTUBE_TOKEN" ]; then
            echo "Missing GitHub secrets: CLIENT_SECRETS and/or YOUTUBE_TOKEN"
            exit 1
          fi
          printf '%s' "$CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json

      - name: Run bot
        run: python bot.py

name: Quran Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,15,21 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yt-dlp moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run script
        run: python bot.py

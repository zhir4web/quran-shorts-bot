name: Quran Shorts - 3 Daily
on:
  schedule:
    # Baghdad windows: 04:55-05:45, 08:55-09:45, and 14:55-15:45.
    # The first heartbeat starts five minutes before each target so a small
    # GitHub queue delay does not push the post into the next window. The
    # runner catches up 05:00/09:00/15:00 slots and the durable ledger makes
    # repeated triggers safe. GitHub cron is still best-effort; the timing
    # report measures any remaining platform delay.
    - cron: '55 1 * * *'
    - cron: '0,15,30,45 2 * * *'
    - cron: '55 5 * * *'
    - cron: '0,15,30,45 6 * * *'
    - cron: '55 11 * * *'
    - cron: '0,15,30,45 12 * * *'
    # Recovery heartbeats after the final target let a delayed runner catch up
    # all due slots with the ledger's twenty-minute spacing protection.
    - cron: '0,15,30,45 13,14,15,16,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, force one publish, or safely catch up the schedule
        type: choice
        options: [preview, publish, scheduled]
        default: preview
      count:
        description: Number of posts in one publish batch (other modes require 1)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      custom_id:
        description: Custom video submission id (used by dashboard)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: quran-shorts-upload
  cancel-in-progress: false
  queue: max
jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    # A stuck render or upload must release the runner within one hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check activation
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          config = json.load(open('automation.json'))
          should_run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or config.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('run=' + str(should_run).lower(), file=output)
          if not should_run:
              print('Publishing is inactive pending source and channel verification.')
          PY
      - name: Cache Python packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements-lock.txt
      - name: Create or publish the next recording
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_MODE: ${{ inputs.mode || 'scheduled' }}
          POST_COUNT: ${{ inputs.count || '1' }}
          CUSTOM_VIDEO_ID: ${{ inputs.custom_id || '' }}
          DASHBOARD_URL: https://quran-shorts-bot.vercel.app
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: python cloud_runner.py "$RUN_MODE" --count "$POST_COUNT"
      - name: Temporary preview frame sheet for visual QA
        if: success() && steps.gate.outputs.run == 'true' && inputs.mode == 'preview'
        run: |
          python - <<'PY'
          import base64
          import glob
          import io
          import json
          import subprocess
          import imageio_ffmpeg
          from PIL import Image, ImageDraw

          videos = glob.glob('state/cloud/*/video.mp4')
          if len(videos) != 1:
              raise SystemExit(f'Expected one preview video, found {len(videos)}')
          video = videos[0]
          duration = imageio_ffmpeg.count_frames_and_secs(video)[1]
          if not duration or duration <= 1:
              raise SystemExit('Preview duration is unavailable')
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          times = sorted({round(max(0.2, min(duration - 0.2, duration * ratio)), 2)
                          for ratio in (0.04, 0.28, 0.56, 0.82)})
          frames = []
          for timestamp in times:
              result = subprocess.run(
                  [ffmpeg, '-hide_banner', '-loglevel', 'error', '-ss', str(timestamp),
                   '-i', video, '-frames:v', '1', '-vf',
                   'scale=300:534:force_original_aspect_ratio=decrease:flags=lanczos',
                   '-f', 'image2pipe', '-vcodec', 'mjpeg', '-q:v', '7', 'pipe:1'],
                  check=True, capture_output=True)
              frame = Image.open(io.BytesIO(result.stdout)).convert('RGB')
              frame.thumbnail((300, 534), Image.Resampling.LANCZOS)
              frames.append((timestamp, frame.copy()))
          cell_w, cell_h, label_h, gap = 300, 534, 30, 14
          sheet = Image.new('RGB', (2 * cell_w + 3 * gap, 2 * (cell_h + label_h) + 3 * gap), '#0b1118')
          draw = ImageDraw.Draw(sheet)
          for i, (timestamp, frame) in enumerate(frames):
              x = gap + (i % 2) * (cell_w + gap)
              y = gap + (i // 2) * (cell_h + label_h + gap)
              draw.text((x + 8, y + 7), f'{timestamp:.2f}s', fill='#f3f4f6')
              sheet.paste(frame, (x, y + label_h))
          metadata_files = glob.glob('state/cloud/*/metadata.json')
          metadata = json.load(open(metadata_files[0], encoding='utf-8'))
          timing_summary = {
              'duration': metadata.get('duration'),
              'mode': metadata.get('word_timing_mode'),
              'intro_seconds': metadata.get('intro_card_seconds'),
              'playlist': [str(p).rsplit('/', 1)[-1].removesuffix('.mp4') for p in metadata.get('background_playlist', [])],
              'layers': [{'start': x.get('start'), 'end': x.get('end')}
                         for x in metadata.get('word_reveal_layers', [])],
          }
          print('VISUAL_TIMING_SUMMARY=' + json.dumps(timing_summary, ensure_ascii=False))
          encoded = io.BytesIO()
          sheet.save(encoded, format='JPEG', quality=58, optimize=True)
          print('VISUAL_CONTACT_SHEET_BEGIN')
          print(base64.b64encode(encoded.getvalue()).decode('ascii'))
          print('VISUAL_CONTACT_SHEET_END')
          PY
      - name: Save preview for inspection
        if: success() && steps.gate.outputs.run == 'true' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v5
        with:
          name: quran-preview
          path: |
            state/cloud/*/video.mp4
            state/cloud/*/background.png
            state/cloud/*/metadata.json
          retention-days: 7
      - name: Performance and health report
        if: always() && steps.gate.outputs.run == 'true' && inputs.mode != 'preview'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud_runner.py report
      - name: Run status notification
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notifications.py run-status --status ${{ job.status }}

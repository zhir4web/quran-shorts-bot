name: Quran Shorts - 3 Daily
on:
  schedule:
    # Baghdad windows: 05:53-06:53, 11:53-12:53, and 17:53-18:53.
    # Cron is UTC: these windows start at 02:53, 08:53, and 14:53 UTC.
    # The runner catches up 06:00/12:00/18:00 Baghdad slots; the durable
    # ledger makes repeated triggers safe. GitHub cron is best-effort; the
    # timing report measures any remaining platform delay.
    - cron: '53 2 * * *'
    - cron: '8,23,38,53 3 * * *'
    - cron: '53 8 * * *'
    - cron: '8,23,38,53 9 * * *'
    - cron: '53 14 * * *'
    - cron: '8,23,38,53 15 * * *'
    # Recovery heartbeats after the final target let a delayed runner catch up
    # all due slots with the ledger's twenty-minute spacing protection.
    - cron: '8,23,38,53 16,17,18,19,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, publish, catch up the schedule, or sync YouTube status without publishing
        type: choice
        options: [preview, publish, scheduled, report]
        default: preview
      count:
        description: Number of posts in one publish batch (other modes require 1)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      custom_id:
        description: Custom video submission id (used by dashboard)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: quran-shorts-upload
  cancel-in-progress: false
  queue: max
jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    # A stuck render or upload must release the runner within one hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check activation
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          config = json.load(open('automation.json'))
          should_run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or config.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('run=' + str(should_run).lower(), file=output)
          if not should_run:
              print('Publishing is inactive pending source and channel verification.')
          PY
      - name: Cache Python packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements-lock.txt
      - name: Create or publish the next recording
        if: steps.gate.outputs.run == 'true' && inputs.mode != 'report'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_MODE: ${{ inputs.mode || 'scheduled' }}
          POST_COUNT: ${{ inputs.count || '1' }}
          CUSTOM_VIDEO_ID: ${{ inputs.custom_id || '' }}
          DASHBOARD_URL: https://quran-shorts-bot.vercel.app
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: python retry_runner.py "$RUN_MODE" --count "$POST_COUNT"
      - name: Save preview for inspection
        if: success() && steps.gate.outputs.run == 'true' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v5
        with:
          name: quran-preview
          path: |
            state/cloud/*/video.mp4
            state/cloud/*/background.png
            state/cloud/*/metadata.json
          retention-days: 7
      - name: Performance and health report
        if: always() && steps.gate.outputs.run == 'true' && inputs.mode != 'preview'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud_runner.py report
      - name: Run status notification
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notifications.py run-status --status ${{ job.status }}

name: Quran Shorts - 3 Daily
on:
  schedule:
    # Baghdad windows: 10:55-11:45, 15:55-16:45, and 19:55-20:45.
    # The first heartbeat starts five minutes before each target so a small
    # GitHub queue delay does not push the post into the next window. The
    # runner catches up 11:00/16:00/20:00 slots and the durable ledger makes
    # repeated triggers safe. GitHub cron is still best-effort; the timing
    # report measures any remaining platform delay.
    - cron: '55 7 * * *'
    - cron: '0,15,30,45 8 * * *'
    - cron: '55 12 * * *'
    - cron: '0,15,30,45 13 * * *'
    - cron: '55 16 * * *'
    - cron: '0,15,30,45 17 * * *'
    # Recovery heartbeats after the final target let a delayed runner catch up
    # all due slots with the ledger's twenty-minute spacing protection.
    - cron: '0,15,30,45 18,19,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, force one publish, or safely catch up the schedule
        type: choice
        options: [preview, publish, scheduled]
        default: preview
      count:
        description: Number of posts in one publish batch (other modes require 1)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
permissions:
  contents: write
concurrency:
  group: quran-shorts-upload
  cancel-in-progress: false
  queue: max
jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    # A stuck render or upload must release the runner within one hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check activation
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          config = json.load(open('automation.json'))
          should_run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or config.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('run=' + str(should_run).lower(), file=output)
          if not should_run:
              print('Publishing is inactive pending source and channel verification.')
          PY
      - name: Cache Python packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements-lock.txt
      - name: Create or publish the next recording
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_MODE: ${{ inputs.mode || 'scheduled' }}
          POST_COUNT: ${{ inputs.count || '1' }}
        run: python cloud_runner.py "$RUN_MODE" --count "$POST_COUNT"
      - name: Save preview for inspection
        if: success() && steps.gate.outputs.run == 'true' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v5
        with:
          name: quran-preview
          path: |
            state/cloud/*/video.mp4
            state/cloud/*/background.png
            state/cloud/*/metadata.json
          retention-days: 7
      - name: Performance and health report
        if: always() && steps.gate.outputs.run == 'true' && inputs.mode != 'preview'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud_runner.py report
      - name: Run status notification
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notifications.py run-status --status ${{ job.status }}


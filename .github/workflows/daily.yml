name: Quran Shorts - 3 Daily
on:
  schedule:
    # Target 11:00, 16:00 and 20:00 Asia/Baghdad (UTC+3).
    # GitHub scheduled jobs can start late, so these avoid night/early-morning posts.
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or publish the next verified recording
        type: choice
        options: [preview, publish]
        default: preview
permissions:
  contents: write
concurrency:
  group: quran-shorts-upload
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check activation
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          config = json.load(open('automation.json'))
          should_run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or config.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('run=' + str(should_run).lower(), file=output)
          if not should_run:
              print('Publishing is inactive pending source and channel verification.')
          PY
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Create or publish the next recording
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: ${{ inputs.mode || 'publish' }}
        run: python cloud_runner.py "$RUN_MODE"
      - name: Save preview for inspection
        if: success() && steps.gate.outputs.run == 'true' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: quran-preview
          path: |
            state/cloud/*/video.mp4
            state/cloud/*/background.png
            state/cloud/*/metadata.json
          retention-days: 7

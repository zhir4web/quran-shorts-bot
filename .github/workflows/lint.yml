name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff==0.14.5
      - name: Ruff check
        run: python -m ruff check .
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          for path in ('automation.json', 'catalog.json'):
              with open(path, encoding='utf-8-sig') as handle:
                  json.load(handle)
              print(path, 'valid')
          PY

name: TikTok - 3 Daily Drafts

on:
  schedule:
    # Baghdad slots are 06:00, 12:00, and 18:00 (UTC+3).
    # Repeat checks catch GitHub cron delays; the draft ledger makes each slot once-only.
    - cron: '0 3 * * *'
    - cron: '15,30,45 3 * * *'
    - cron: '0 9 * * *'
    - cron: '15,30,45 9 * * *'
    - cron: '0 15 * * *'
    - cron: '15,30,45 15 * * *'
    # Evening recovery checks catch up any earlier missed slots, but never yesterday's.
    - cron: '0,15,30,45 16,17,18,19,20 * * *'

permissions:
  contents: write

concurrency:
  group: quran-shorts-tiktok-drafts
  cancel-in-progress: false
  queue: max

jobs:
  draft:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check TikTok readiness and select the next due slot
        id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DASHBOARD_URL: https://quran-shorts-bot.vercel.app
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: python tiktok_schedule.py
      - name: Create a separate TikTok video
        if: steps.due.outputs.slot != ''
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python retry_runner.py preview --count 1 --platform tiktok
      - name: Send the generated video to TikTok Inbox as a draft
        if: success() && steps.due.outputs.slot != ''
        env:
          DASHBOARD_URL: https://quran-shorts-bot.vercel.app
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TIKTOK_SCHEDULE_SLOT: ${{ steps.due.outputs.slot }}
        run: python tiktok_draft.py upload-latest
      - name: Report scheduled draft status
        if: always() && steps.due.outputs.slot != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notifications.py run-status --status ${{ job.status }}
